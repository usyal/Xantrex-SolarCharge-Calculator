spring.application.name=solarchargecalculator
server.tomcat.accesslog.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=false


# Default profile (no DB creds here). To use Postgres:
#   - run with profile 'postgres' and set env vars DB_URL, DB_UserName, DB_Pwd
# Example:
#   DB_URL='jdbc:postgresql://HOST:5432/DB' DB_UserName='USER' DB_Pwd='PASS' ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres