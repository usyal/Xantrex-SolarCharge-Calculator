spring.application.name=solarchargecalculator

# --- Database configuration ---
# Local dev default: H2 in-memory (easy for Iteration 1)
spring.datasource.url=jdbc:h2:mem:solarchargecalculator;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Optional: Production/Postgres via env vars (Render) ---
# Uncomment these and set env vars when you switch off H2.
# spring.datasource.url=${DATABASE_URL}
# spring.datasource.username=${DATABASE_USERNAME:database_umhi_user}
# spring.datasource.password=${DATABASE_PASSWORD}
# spring.datasource.driverClassName=org.postgresql.Driver
