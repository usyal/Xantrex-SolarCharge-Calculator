<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
  </head>
<body class="bg-light">
  <!--Navigation Bar-->
  <nav class="navbar navbar-expand-lg sticky-top" style="background-color: #25257d;">
    <div class="container-fluid">
      <a class="navbar-brand ms-5" href="https://xantrex.com/" target="_blank">
        <img src="/designs/xantrex-logo.png" alt="Xantrex" width="150" height="45">
      </a>
      <h1 class="fw-bold fs-4 fs-sm-3 fs-md-2 fs-lg-1 m-0 text-white">Sign Up</h1>
    </div>
  </nav>

  <!-- Input User Info -->
  <div class="container py-5 mt-4">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">

            <div class="alert alert-success" role="alert" aria-live="polite" th:if="${message != null}" th:text="${message}"></div>
            <div class="alert alert-success" role="alert" aria-live="polite" th:if="${param.logout}">You have not SignUp yet.</div>
            <p class="text-muted small mb-3">Sign up to access the Solar Charge Controller Calculator.</p>
            <p class="text-muted small mb-3">Mandatory fields are marked *</p>

            <form action="/user/signup" method="post">
              <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <div class="alert alert-danger" role="alert" aria-live="assertive" th:if="${error != null}" th:text="${error}"></div>

              <div class="mb-3">
                <label for="NameSU" class="form-label">Username *</label>
                <input type="text" class="form-control" id="NameSU" name="nameSU" required th:value="${inputs != null ? inputs.nameSU : ''}">
              </div>
              <div class="mb-3">
                <label for="PwdSU" class="form-label">Password *</label>
                <input type="password" class="form-control" id="PwdSU" name="PwdSU" required th:value="${inputs != null ? inputs.PwdSU : ''}">
              </div>
              <div th:if="${error != null and !#strings.isEmpty(error)}" class="alert alert-danger mt-3">
                <span th:text="${error}"></span>
              </div>
              
              <button class="btn btn-primary w-100" type="submit">Register</button>
            </form>
            <div class="mt-3 small d-flex justify-content-between">
              <a th:href="@{/}" class="text-decoration-none">Back to home</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Allows page to reload so looged out user cannot go back using browser and access cached page-->
   <script>
    window.onpageshow = function(event) {
        if (event.persisted) {
            window.location.reload();
        }
    };
    </script>
</body>
</html>
