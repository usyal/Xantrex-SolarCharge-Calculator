

<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  />
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
  ></script>

  <!-- Load from Spring Boot static: src/main/resources/static/styles.css -->
  <link rel="stylesheet" th:href="@{/styles.css}" />

  <title>Sign Up</title>
</head>
<body class="bg-light">
  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg sticky-top" style="background-color: #25257d;">
    <div class="container-fluid">
      <a class="navbar-brand ms-5" th:href="@{/}">
        <img src="/designs/xantrex-logo.png" alt="Xantrex" width="150" height="45" />
      </a>
      <h1 class="fw-bold fs-4 m-0 text-white">Create Your Account</h1>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h2 class="h4 mb-2">Sign Up</h2>
            <p class="text-muted mb-4">Create an account to use the Solar Charge Controller Calculator.</p>

            <!-- If your signup logic sets an error message in the model -->
            <div th:if="${error != null and !#strings.isEmpty(error)}" class="alert alert-danger" role="alert">
              <span th:text="${error}"></span>
            </div>

            <!--
              This form posts to /user/signup (Spencer’s handler). If your team later changes
              the endpoint, update th:action.
            -->
            <form class="row g-3" th:action="@{/user/signup}" method="post">
              <div class="col-12">
                <label for="username" class="form-label">Username</label>
                <input
                  type="text"
                  class="form-control"
                  id="username"
                  name="nameSU"
                  placeholder="Choose a username"
                  autocomplete="username"
                  required
                />
              </div>

              <div class="col-12">
                <label for="password" class="form-label">Password</label>
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  name="PwdSU"
                  placeholder="Create a password"
                  autocomplete="new-password"
                  required
                />
                <div class="form-text">Use a strong password you can remember.</div>
              </div>

              <div class="col-12 d-flex gap-2">
                <a th:href="@{/login}" class="btn btn-outline-secondary">Back to login</a>
                <button type="submit" class="btn btn-primary" style="background-color:#25257d; border-color:#25257d;">
                  Register
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
