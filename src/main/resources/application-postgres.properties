spring.application.name=solarchargecalculator

# Use Postgres via environment variables (works locally + on Render)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Do not expose H2 console
spring.h2.console.enabled=false

# Optional: reduce accidental lazy-load queries during template rendering
# spring.jpa.open-in-view=false
# Disable H2 console
spring.h2.console.enabled=false
